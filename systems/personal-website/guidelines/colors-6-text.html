<!-- @dsCard group="Colors" viewport="700x150" name="Text on cream" subtitle="Warm ink ramp — never pure black" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-ink);
            "
            >Ink</span
          ><span
            class="meta"
            style="width: 64px"
            >#141413</span
          ><span style="font-size: 14px; color: var(--text-ink)"
            >Headlines and primary text</span
          >
        </div>
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-body-strong);
            "
            >Body strong</span
          ><span
            class="meta"
            style="width: 64px"
            >#252523</span
          ><span style="font-size: 14px; color: var(--text-body-strong)"
            >Lead paragraphs</span
          >
        </div>
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-body);
            "
            >Body</span
          ><span
            class="meta"
            style="width: 64px"
            >#3d3d3a</span
          ><span style="font-size: 14px; color: var(--text-body)"
            >Default running text</span
          >
        </div>
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-muted);
            "
            >Muted</span
          ><span
            class="meta"
            style="width: 64px"
            >#6c6a64</span
          ><span style="font-size: 14px; color: var(--text-muted)"
            >Sub-headings, breadcrumbs</span
          >
        </div>
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-muted-soft);
            "
            >Muted soft</span
          ><span
            class="meta"
            style="width: 64px"
            >#8e8b82</span
          ><span style="font-size: 14px; color: var(--text-muted-soft)"
            >Captions, fine print</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
