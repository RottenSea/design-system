<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="max-width: 520px">
        <span
          style="
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--text-ink);
            display: block;
          "
          >A place for the work your team already does</span
        >
        <p
          style="
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.55;
            color: var(--text-body);
            margin: 14px 0 0;
          "
        >
          Drafts, reviews, and shipped versions live in one thread. Comments
          resolve against the version they were written on, so the history stays
          readable a year later.
        </p>
      </div>
    </div>
  </body>
</html>
