<!-- @dsCard group="Colors" viewport="700x140" name="Hairlines" subtitle="Borders read as one elevation step, not as ink lines" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
        <div
          style="
            border: var(--border-hairline);
            border-radius: var(--radius-lg);
            padding: 16px;
          "
        >
          <span
            class="n"
            style="margin: 0"
            >Hairline · card border</span
          ><span class="h">--hairline · #e6dfd8</span>
        </div>
        <div
          style="
            border: var(--border-hairline-soft);
            border-radius: var(--radius-lg);
            padding: 16px;
          "
        >
          <span
            class="n"
            style="margin: 0"
            >Hairline soft · in-band divider</span
          ><span class="h">--hairline-soft · #ebe6df</span>
        </div>
      </div>
    </div>
  </body>
</html>
