<!-- @dsCard group="Colors" viewport="700x130" name="Dark surfaces" subtitle="Warm navy, never blue-black — product chrome, comparison cards, footer" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="sw">
        <div class="s">
          <span
            class="chip"
            style="background: var(--surface-dark)"
          ></span
          ><span class="n">Dark</span><span class="h">#181715</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--surface-dark-soft)"
          ></span
          ><span class="n">Dark soft</span><span class="h">#1f1e1b</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--surface-dark-elevated)"
          ></span
          ><span class="n">Dark elevated</span><span class="h">#252320</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--hairline-on-dark)"
          ></span
          ><span class="n">Hairline on dark</span><span class="h">#31302c</span>
        </div>
      </div>
    </div>
  </body>
</html>
