<!-- @dsCard group="Colors" viewport="700x150" name="Coral in use" subtitle="One button on cream, or a whole surface — nothing in between" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div
        style="
          display: grid;
          grid-template-columns: 1fr 1.2fr;
          gap: 16px;
          align-items: stretch;
        "
      >
        <div
          style="
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <span
            style="font-size: 16px; font-weight: 500; color: var(--text-ink)"
            >Scarce</span
          >
          <span style="font-size: 13px; color: var(--text-body)"
            >One coral CTA per band.</span
          >
          <span
            style="
              background: var(--color-primary);
              color: #fff;
              font-size: 14px;
              font-weight: 500;
              padding: 12px 20px;
              border-radius: var(--radius-md);
              align-self: flex-start;
            "
            >Start free</span
          >
        </div>
        <div
          style="
            background: var(--color-primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <span
            style="
              font-family: var(--font-display);
              font-size: 24px;
              color: #fff;
              letter-spacing: -0.3px;
            "
            >Generous</span
          >
          <span style="font-size: 13px; color: #fff; opacity: 0.92"
            >Full-bleed callouts carry the coral as a surface.</span
          >
          <span
            style="
              background: var(--surface-canvas);
              color: var(--text-ink);
              font-size: 14px;
              font-weight: 500;
              padding: 12px 20px;
              border-radius: var(--radius-md);
              align-self: flex-start;
            "
            >Talk to sales</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
