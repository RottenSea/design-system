<!-- @dsCard group="Spacing & shape" viewport="700x260" name="Section rhythm" subtitle="96px between bands, 32px inside cards — uniform, never tightened" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div
        style="
          border: var(--border-hairline);
          border-radius: var(--radius-lg);
          overflow: hidden;
        "
      >
        <div style="padding: 24px; background: var(--surface-canvas)">
          <span
            style="
              font-family: var(--font-display);
              font-size: 22px;
              color: var(--text-ink);
              letter-spacing: -0.3px;
            "
            >Cream band</span
          >
        </div>
        <div
          style="
            height: 48px;
            background: repeating-linear-gradient(
              90deg,
              var(--hairline) 0 6px,
              transparent 6px 12px
            );
            position: relative;
          "
        >
          <span
            class="meta"
            style="
              position: absolute;
              left: 12px;
              top: 16px;
              background: var(--surface-canvas);
              padding: 0 6px;
            "
            >96px section gap (shown at 50%)</span
          >
        </div>
        <div
          style="
            padding: 24px;
            background: var(--surface-card);
            display: flex;
            gap: 12px;
          "
        >
          <div
            style="
              flex: 1;
              background: var(--surface-canvas);
              border: var(--border-hairline);
              border-radius: var(--radius-lg);
              padding: 16px;
            "
          >
            <span
              class="n"
              style="margin: 0"
              >Card</span
            ><span class="h">32px padding at full size</span>
          </div>
          <div
            style="
              flex: 1;
              background: var(--surface-canvas);
              border: var(--border-hairline);
              border-radius: var(--radius-lg);
              padding: 16px;
            "
          >
            <span
              class="n"
              style="margin: 0"
              >Card</span
            ><span class="h">32px padding at full size</span>
          </div>
          <div
            style="
              flex: 1;
              background: var(--surface-canvas);
              border: var(--border-hairline);
              border-radius: var(--radius-lg);
              padding: 16px;
            "
          >
            <span
              class="n"
              style="margin: 0"
              >Card</span
            ><span class="h">32px padding at full size</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
