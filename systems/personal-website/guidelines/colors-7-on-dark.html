<!-- @dsCard group="Colors" viewport="700x120" name="Text on dark" subtitle="Cream-tinted white, echoing the canvas — never pure white" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div
        style="
          background: var(--surface-dark);
          border-radius: var(--radius-lg);
          padding: 20px 24px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        "
      >
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-on-dark);
            "
            >On dark</span
          ><span
            class="meta"
            style="width: 64px"
            >#faf9f5</span
          ><span style="font-size: 14px; color: var(--text-on-dark)"
            >Titles and primary text on dark</span
          >
        </div>
        <div class="row">
          <span
            style="
              width: 110px;
              font-size: 14px;
              font-weight: 500;
              color: var(--text-on-dark-soft);
            "
            >On dark soft</span
          ><span
            class="meta"
            style="width: 64px"
            >#a09d96</span
          ><span style="font-size: 14px; color: var(--text-on-dark-soft)"
            >Footer body, secondary labels</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
