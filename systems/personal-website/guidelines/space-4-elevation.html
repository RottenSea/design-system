<!-- @dsCard group="Spacing & shape" viewport="700x170" name="Elevation" subtitle="Color-block first. Shadow appears twice in the whole system" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div
        style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px"
      >
        <div
          style="
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 14px;
            min-height: 74px;
          "
        >
          <span
            class="n"
            style="margin: 0; color: var(--text-ink)"
            >Flat</span
          ><span class="h">Feature cards — fill only</span>
        </div>
        <div
          style="
            background: var(--surface-canvas);
            border: var(--border-hairline);
            border-radius: var(--radius-lg);
            padding: 14px;
            min-height: 74px;
          "
        >
          <span
            class="n"
            style="margin: 0; color: var(--text-ink)"
            >Hairline</span
          ><span class="h">Inputs, tiles, comparison</span>
        </div>
        <div
          style="
            background: var(--surface-canvas);
            border: var(--border-hairline);
            box-shadow: var(--shadow-hover);
            border-radius: var(--radius-lg);
            padding: 14px;
            min-height: 74px;
          "
        >
          <span
            class="n"
            style="margin: 0; color: var(--text-ink)"
            >Hover</span
          ><span class="h">0 1px 3px / 8% — rare</span>
        </div>
        <div
          style="
            background: var(--surface-dark);
            box-shadow: var(--shadow-float);
            border-radius: var(--radius-lg);
            padding: 14px;
            min-height: 74px;
          "
        >
          <span
            class="n"
            style="margin: 0; color: var(--text-on-dark)"
            >Float</span
          ><span class="h">Cookie banner only</span>
        </div>
      </div>
    </div>
  </body>
</html>
