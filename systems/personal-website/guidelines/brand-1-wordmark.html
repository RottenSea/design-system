<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="assets/logo-colored.svg + the name in Manrope Medium. The mark is never inverted" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; gap: 16px; align-items: stretch">
        <div
          style="
            flex: 1;
            background: var(--surface-canvas);
            border: var(--border-hairline);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
          "
        >
          <span style="display: flex; align-items: center; gap: 8px"
            ><img
              src="../assets/logo-colored.svg"
              alt=""
              width="26"
              height="26"
              style="display: block"
            /><span
              style="
                font-family: var(--font-sans);
                font-size: 16px;
                font-weight: 500;
                color: var(--text-ink);
              "
              >The Key of Urala</span
            ></span
          >
        </div>
        <div
          style="
            flex: 1;
            background: var(--surface-dark);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
          "
        >
          <span style="display: flex; align-items: center; gap: 8px"
            ><img
              src="../assets/logo-colored.svg"
              alt=""
              width="26"
              height="26"
              style="display: block"
            /><span
              style="
                font-family: var(--font-sans);
                font-size: 16px;
                font-weight: 500;
                color: var(--text-on-dark);
              "
              >The Key of Urala</span
            ></span
          >
        </div>
        <div style="flex: 2; padding: 20px; display: flex; align-items: center">
          <span
            style="font-size: 13px; line-height: 1.5; color: var(--text-muted)"
            >Mark at 26px, then the name in Manrope Medium 16px, sentence case,
            8px apart. Pass it to the
            <code style="font-family: var(--font-mono); font-size: 12px"
              >logo</code
            >
            slot on
            <code style="font-family: var(--font-mono); font-size: 12px"
              >TopNav</code
            >
            and
            <code style="font-family: var(--font-mono); font-size: 12px"
              >Footer</code
            >. The mark keeps its own colors on cream and on dark.</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
