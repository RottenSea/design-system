<!-- @dsCard group="Type" viewport="700x130" name="Captions & micro-labels" subtitle="The uppercase label is the system's only non-sentence-case type" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div
          style="
            display: flex;
            align-items: baseline;
            justify-content: space-between;
          "
        >
          <span
            style="
              font-family: var(--font-sans);
              font-size: 13px;
              font-weight: 500;
              color: var(--text-ink);
            "
            >Included in every plan</span
          ><span class="meta">caption · 13px/500</span>
        </div>
        <div
          style="
            display: flex;
            align-items: baseline;
            justify-content: space-between;
          "
        >
          <span
            style="
              font-family: var(--font-sans);
              font-size: 12px;
              font-weight: 500;
              letter-spacing: 1.5px;
              text-transform: uppercase;
              color: var(--text-muted);
            "
            >Customer support</span
          ><span class="meta">caption-uppercase · 12px/500 · 1.5px</span>
        </div>
      </div>
    </div>
  </body>
</html>
