<!-- @dsCard group="Colors" viewport="700x130" name="Accents & semantic" subtitle="Small marks only — status dots, category badges, validation" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="sw">
        <div class="s">
          <span
            class="chip"
            style="background: var(--accent-teal)"
          ></span
          ><span class="n">Teal</span><span class="h">#5db8a6</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--accent-amber)"
          ></span
          ><span class="n">Amber</span><span class="h">#e8a55a</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--status-success)"
          ></span
          ><span class="n">Success</span><span class="h">#5db872</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--status-warning)"
          ></span
          ><span class="n">Warning</span><span class="h">#d4a017</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--status-error)"
          ></span
          ><span class="n">Error</span><span class="h">#c64545</span>
        </div>
      </div>
    </div>
  </body>
</html>
