<!-- @dsCard group="Brand" viewport="700x170" name="Surface rhythm" subtitle="cream → cream-card → dark → cream → coral → dark footer. Never two alike in a row" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            background: var(--surface-canvas);
            color: var(--text-ink);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
          "
        >
          <span>Canvas</span
          ><span style="opacity: 0.75; font-weight: 400"
            >Hero, body sections</span
          >
        </div>
        <div
          style="
            background: var(--surface-card);
            color: var(--text-ink);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
          "
        >
          <span>Cream card</span
          ><span style="opacity: 0.75; font-weight: 400">Feature grid</span>
        </div>
        <div
          style="
            background: var(--surface-dark);
            color: var(--text-on-dark);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
          "
        >
          <span>Dark</span
          ><span style="opacity: 0.75; font-weight: 400"
            >Product mockup, comparison</span
          >
        </div>
        <div
          style="
            background: var(--color-primary);
            color: #fff;
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
          "
        >
          <span>Coral</span
          ><span style="opacity: 0.75; font-weight: 400"
            >Callout, pre-footer CTA</span
          >
        </div>
        <div
          style="
            background: var(--surface-dark);
            color: var(--text-on-dark);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
          "
        >
          <span>Dark</span
          ><span style="opacity: 0.75; font-weight: 400">Footer</span>
        </div>
      </div>
    </div>
  </body>
</html>
