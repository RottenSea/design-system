<!-- @dsCard group="Colors" viewport="700x130" name="Cream surfaces" subtitle="The warm floor — canvas, soft band, card, strong cream" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="sw">
        <div class="s">
          <span
            class="chip"
            style="
              background: var(--surface-canvas);
              border: var(--border-hairline);
            "
          ></span
          ><span class="n">Canvas</span><span class="h">#faf9f5</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="
              background: var(--surface-soft);
              border: var(--border-hairline);
            "
          ></span
          ><span class="n">Soft</span><span class="h">#f5f0e8</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--surface-card)"
          ></span
          ><span class="n">Card</span><span class="h">#efe9de</span>
        </div>
        <div class="s">
          <span
            class="chip"
            style="background: var(--surface-cream-strong)"
          ></span
          ><span class="n">Cream strong</span><span class="h">#e8e0d2</span>
        </div>
      </div>
    </div>
  </body>
</html>
