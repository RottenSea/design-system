<!-- @dsCard group="Type" viewport="700x150" name="Weight rule" subtitle="Escalate by size, never by weight — the display serif stays at 400" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
        <div
          style="
            border: var(--border-hairline);
            background: var(--surface-soft);
            border-radius: var(--radius-lg);
            padding: 16px;
          "
        >
          <span
            style="
              font-family: var(--font-display);
              font-size: 32px;
              font-weight: 400;
              letter-spacing: -0.5px;
              color: var(--text-ink);
              display: block;
            "
            >Bigger, not bolder</span
          ><span
            class="h"
            style="color: var(--status-success)"
            >Do · weight 400</span
          >
        </div>
        <div
          style="
            border: var(--border-hairline);
            background: var(--surface-soft);
            border-radius: var(--radius-lg);
            padding: 16px;
          "
        >
          <span
            style="
              font-family: var(--font-display);
              font-size: 32px;
              font-weight: 700;
              letter-spacing: -0.5px;
              color: var(--text-ink);
              display: block;
            "
            >Bigger, not bolder</span
          ><span
            class="h"
            style="color: var(--status-error)"
            >Don't · weight 700 reads bombastic</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
