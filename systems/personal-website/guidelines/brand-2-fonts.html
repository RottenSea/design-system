<!-- @dsCard group="Brand" viewport="700x180" name="The three faces" subtitle="Noto Serif SC display · Manrope body · Maple Mono code" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../src/styles/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div
          style="
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
          "
        >
          <span
            style="
              font-family: var(--font-display);
              font-size: 30px;
              letter-spacing: -0.5px;
              color: var(--text-ink);
            "
            >Noto Serif SC</span
          ><span class="meta">variable 400 to 700 · Latin and Chinese</span>
        </div>
        <div
          style="
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
          "
        >
          <span
            style="
              font-family: var(--font-sans);
              font-size: 26px;
              font-weight: 400;
              color: var(--text-ink);
            "
            >Manrope</span
          ><span class="meta"
            >variable 400 to 700 · Chinese falls back to Noto Sans SC</span
          >
        </div>
        <div
          style="
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
          "
        >
          <span
            style="
              font-family: var(--font-mono);
              font-size: 22px;
              color: var(--text-ink);
            "
            >Maple Mono NL NF CN</span
          ><span class="meta"
            >Regular 400 · Italic · Medium 500 · Bold 700</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
