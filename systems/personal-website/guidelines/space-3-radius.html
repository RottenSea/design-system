<!-- @dsCard group="Spacing & shape" viewport="700x160" name="Radius scale" subtitle="8px controls · 12px cards · 16px hero artifact · pill badges" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../src/styles.css"
    />
    <style>
      body {
        margin: 0;
        background: var(--surface-canvas);
        font-family: var(--font-sans);
      }
      .c {
        padding: 20px 24px;
        box-sizing: border-box;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .s {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chip {
        height: 56px;
        border-radius: var(--radius-md);
        display: block;
      }
      .n {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-ink);
        margin-top: 8px;
        display: block;
      }
      .h {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        display: block;
        margin-top: 2px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted-soft);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div style="display: flex; gap: 12px; align-items: flex-end">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 4px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-xs</span
          ><span class="h">4px · Badge accents</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 6px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-sm</span
          ><span class="h">6px · Inline buttons</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 8px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-md</span
          ><span class="h">8px · Buttons, inputs</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 12px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-lg</span
          ><span class="h">12px · Content cards</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 16px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-xl</span
          ><span class="h">16px · Hero artifact</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              height: 58px;
              background: var(--surface-card);
              border: var(--border-hairline);
              border-radius: 9999px;
              display: block;
            "
          ></span
          ><span
            class="n"
            style="margin: 0"
            >--radius-pill</span
          ><span class="h">9999px · Badges</span>
        </div>
      </div>
    </div>
  </body>
</html>
