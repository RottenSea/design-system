# Builds the docs site in docs/ and deploys it to GitHub Pages,
# following https://docs.astro.build/en/guides/deploy/github/
name: Docs

# The docs site now builds for the root of its own domain. Until that subdomain is set up, a
# deploy to rottensea.github.io/design-system would break every link, so it runs only by hand.
# When the subdomain is ready, restore the push trigger on docs/**, systems/** (the docs show each
# system's tokens and components) and this file.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run replaces an older queued one, but a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rottensea/ds-docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
