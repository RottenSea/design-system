# Builds the docs site in docs/ and deploys it to GitHub Pages at rottensea.github.io/design-system,
# following https://docs.astro.build/en/guides/deploy/github/
# It also runs when a system changes, because the docs will show each system's tokens and components.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "systems/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run replaces an older queued one, but a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rottensea/ds-docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
