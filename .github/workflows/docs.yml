# Builds the docs site in docs/ and deploys it to GitHub Pages,
# following https://docs.astro.build/en/guides/deploy/github/
name: Docs

# The site is served at rottensea.github.io/design-system/, this repository's project site, and
# builds with that base. It deploys when the docs change, when a system changes (the docs show
# each system's tokens and components), and when this file does; or by hand.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "systems/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run replaces an older queued one, but a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      # The docs and the systems they depend on, in order: the docs import each system's built
      # tokens.css, which a fresh checkout does not have.
      - run: pnpm --filter "@rottensea/ds-docs..." build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
